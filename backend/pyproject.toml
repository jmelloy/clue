[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fakeredis>=2.36.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "app.games*", "app.games.clue*", "app.games.holdem*"]

[tool.setuptools]
py-modules = ["agent_runner"]
