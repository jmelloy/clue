[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fakeredis>=2.37.0",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
    "websockets>=17.0.1",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "app.games*", "app.games.clue*", "app.games.holdem*"]

[tool.setuptools]
py-modules = ["agent_runner"]
